name: Publish site

# OrganizeOS Websites 2.0 Phase 5: the publish executor. Builds an org's
# published project with OUR CLI (this fork: animation package removed,
# template patches applied) and deploys it as a new immutable deployment on
# the organizeos-sites Vercel project, then reports the deployment URL back to
# OrganizeOS, which flips the org's ledger pointer. Each publish is its own
# deployment URL, so the flip is atomic and rollback is repointing.
#
# With the URL it reports what this run's CLI says of itself, read from the
# CLI it built and never from configuration: the org script switch (orgScript)
# and the guard level (guardLevel, ORGANIZEOS_GUARD_LEVEL), which OrganizeOS
# stores per build (docs/ORGANIZEOS-FORK.md section 5).
#
# The run ends by telling the builder how it went (internal/publish-status):
# PUBLISHED once the pointer is flipped, FAILED when any step fails. That is
# what the builder's Publish dialog shows the admin; without it every publish
# reads "pending" until the UI gives up.
#
# No run script holds an expression: inputs, variables, secrets and step
# outputs reach it through its step's env, JSON bodies are built from those
# with node, and a step output is written only after its value is checked. A
# dispatch input can then never break out of the shell or a body.
#
# Required repository secrets (all server-to-server; none reach the built app):
#   WSTD_SERVICE_TOKEN          TRPC_SERVER_API_TOKEN of the deployed builder
#                               (also authenticates the publish-status report)
#   VERCEL_TOKEN                scoped deploy token for the sites project
#   VERCEL_ORG_ID               Vercel team/org id
#   VERCEL_SITES_PROJECT_ID     project id of organizeos-sites
#   PUBLISH_CALLBACK_URL        OrganizeOS publish-callback endpoint
#   PUBLISH_CALLBACK_TOKEN      shared secret for that endpoint
# Required repository variable:
#   BUILDER_ORIGIN              e.g. https://builder.organizeos.org

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Published Build id to deploy"
        required: true
      organization_id:
        description: "OrganizeOS organization id (for the pointer flip)"
        required: true

concurrency:
  # One publish at a time per org; a newer publish supersedes a queued one.
  group: publish-${{ inputs.organization_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    timeout-minutes: 25
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build CLI
        run: |
          pnpm install
          pnpm -r --filter "./packages/*" build

      - name: Sync project bundle
        working-directory: ${{ runner.temp }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
        run: |
          node "$GITHUB_WORKSPACE/packages/cli/bin.js" sync \
            --buildId "$BUILD_ID" \
            --origin "$BUILDER_ORIGIN" \
            --authToken "$WSTD_SERVICE_TOKEN"

      - name: Build site
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/packages/cli/bin.js" build \
            --template react-router --template react-router-vercel

      - name: Read the org script switch
        # OrganizeOS fork: OrganizeOS launches a Website only from a build that
        # carries no org script, so the publish reports what this run's CLI
        # says (docs/ORGANIZEOS-FORK.md section 10), never configuration, and
        # fails unless the switch is off and the address rule is there.
        id: org-script
        working-directory: packages/cli
        run: |
          value=$(node --input-type=module -e '
            import { orgScriptMayRun, urlMayRun } from "@organizeos/site-components/org-script";
            if (typeof urlMayRun !== "function" || urlMayRun("javascript:alert(1)", false) !== false) {
              throw new Error("this CLI does not check unsafe addresses");
            }
            process.stdout.write(JSON.stringify(orgScriptMayRun()));
          ')
          if [ "$value" != "false" ]; then
            echo "::error::orgScriptMayRun() is ${value:-unreadable}. OrganizeOS launches a Website only from a build that carries no org script: turn the switch on only together with that gate."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Read the guard level
        # OrganizeOS fork: which of OrganizeOS's launch requirements this run's
        # CLI meets (ORGANIZEOS_GUARD_LEVEL, docs/ORGANIZEOS-FORK.md section 5),
        # read from the CLI it built, never configuration. It fails unless the
        # value is an integer from 0 to 32767, the range OrganizeOS takes.
        id: guard-level
        working-directory: packages/cli
        run: |
          value=$(node --input-type=module -e '
            import { ORGANIZEOS_GUARD_LEVEL } from "@organizeos/site-components/org-script";
            process.stdout.write(JSON.stringify(ORGANIZEOS_GUARD_LEVEL));
          ')
          if [[ ! "$value" =~ ^(0|[1-9][0-9]{0,4})$ ]] || [ "$value" -gt 32767 ]; then
            echo "::error::ORGANIZEOS_GUARD_LEVEL is ${value:-unreadable}. OrganizeOS takes an integer from 0 to 32767."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        # The install runs without the deploy token in its environment.
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITES_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          env -u VERCEL_TOKEN npm install --global vercel@latest
          url=$(vercel deploy --token "$VERCEL_TOKEN" --yes --prod --skip-domain)
          if [[ ! "$url" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Vercel did not answer with a deployment URL."
            exit 1
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Flip the OrganizeOS pointer
        # curl fails only on 4xx and 5xx. A redirect (an http:// or slightly
        # different PUBLISH_CALLBACK_URL answers 308) would pass while flipping
        # nothing, and the run would still report the build PUBLISHED. Anything
        # but a 2xx fails the run.
        # OrganizeOS fork: orgScript and guardLevel are what this run's CLI
        # said ("Read the org script switch", "Read the guard level"), each
        # from that step's output alone and checked again here before anything
        # is sent: orgScript the JSON false, guardLevel an integer from 0 to
        # 32767 (docs/ORGANIZEOS-FORK.md sections 5 and 10). On success the log
        # shows the answer's live and launchable only, each only when it is a
        # boolean; on failure it shows the answer.
        env:
          CALLBACK_URL: ${{ secrets.PUBLISH_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.PUBLISH_CALLBACK_TOKEN }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          BUILD_ID: ${{ inputs.build_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          ORG_SCRIPT: ${{ steps.org-script.outputs.value }}
          GUARD_LEVEL: ${{ steps.guard-level.outputs.value }}
        run: |
          body=$(node -e '
            const env = process.env;
            let orgScript;
            try {
              orgScript = JSON.parse(env.ORG_SCRIPT ?? "");
            } catch {}
            if (orgScript !== false) {
              console.log("::error::The org script switch did not read false, so nothing was sent.");
              process.exit(1);
            }
            const level = env.GUARD_LEVEL ?? "";
            if (/^(0|[1-9][0-9]{0,4})$/.test(level) === false || Number(level) > 32767) {
              console.log("::error::The guard level is not an integer from 0 to 32767, so nothing was sent.");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify({
              organizationId: env.ORGANIZATION_ID ?? "",
              buildId: env.BUILD_ID ?? "",
              deploymentUrl: env.DEPLOYMENT_URL ?? "",
              orgScript,
              guardLevel: Number(level),
            }));
          ') || { printf '%s\n' "$body"; exit 1; }
          response="$RUNNER_TEMP/callback-response.txt"
          status=$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -o "$response" -w '%{http_code}' -X POST \
            "$CALLBACK_URL" \
            -H "Authorization: $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body") || { cat "$response"; echo; exit 1; }
          case "$status" in
            2??)
              echo "Pointer flipped ($status)"
              RESPONSE="$response" node -e '
                let answer;
                try {
                  answer = JSON.parse(require("node:fs").readFileSync(process.env.RESPONSE, "utf8"));
                } catch {
                  process.exit(0);
                }
                for (const key of ["live", "launchable"]) {
                  const value = typeof answer === "object" && answer !== null ? answer[key] : undefined;
                  if (typeof value === "boolean") {
                    console.log(key + "=" + value);
                  }
                }
              ' || true
              ;;
            *)
              cat "$response"
              echo
              echo "::error::The publish callback answered $status, so the pointer was not flipped. PUBLISH_CALLBACK_URL must be the exact https URL, with no redirect."
              exit 1
              ;;
          esac

      - name: Report the build as published
        # The site is live once the pointer is flipped; a failed status report
        # must not fail the run (and so must not mark the build FAILED below).
        continue-on-error: true
        env:
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          body=$(node -e 'process.stdout.write(JSON.stringify({ buildId: process.env.BUILD_ID ?? "", status: "PUBLISHED" }))')
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            "$BUILDER_ORIGIN/internal/publish-status" \
            -H "Authorization: $WSTD_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body"

      - name: Report the build as failed
        if: failure()
        env:
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          body=$(node -e 'process.stdout.write(JSON.stringify({ buildId: process.env.BUILD_ID ?? "", status: "FAILED" }))')
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            "$BUILDER_ORIGIN/internal/publish-status" \
            -H "Authorization: $WSTD_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body"
