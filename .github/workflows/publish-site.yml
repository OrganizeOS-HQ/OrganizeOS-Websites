name: Publish site

# OrganizeOS Websites 2.0 Phase 5: the publish executor. Builds an org's
# published project with OUR CLI (this fork: animation package removed,
# template patches applied) and deploys it as a new immutable deployment on
# the organizeos-sites Vercel project, then reports the deployment URL back to
# OrganizeOS, which flips the org's ledger pointer. Each publish is its own
# deployment URL, so the flip is atomic and rollback is repointing.
#
# With the URL it reports whether this build carries org code (orgScript) and
# the guard level of this run's CLI (guardLevel, ORGANIZEOS_GUARD_LEVEL), which
# OrganizeOS stores per build (docs/ORGANIZEOS-FORK.md section 5). orgScript is
# a fact of the build, not of the CLI: prebuild writes it, last, to a facts
# file outside the directory vercel deploy uploads, and the run fails before
# anything deploys when the file is missing or malformed, or says the build
# carries org code while this CLI's orgEmbedsMayShip() is off. Embeds ship:
# orgEmbedsMayShip() is on and the guard level is 2, so a build whose HTML
# Embeds, Markdown Embeds or custom code carry org code reports true, and
# OrganizeOS serves it only at that level. The guard level and the switches
# are read from the CLI it built, never from configuration. The builder sends
# the embeds input, true, only when it ships embeds; the run fails when that
# differs from this CLI's orgEmbedsMayShip() (the minutes between a flip
# merging and the builder deploying), so a dispatch without it fails while
# embeds ship.
#
# The builder's Publish dialog sends the addresses the admin ticked as the
# targets input, a JSON array of keys (builtin, or a host the org's site is
# served on). The run checks it before anything installs or deploys and sends
# it to OrganizeOS as the callback's targets, which puts the site live at each
# one when the build passes OrganizeOS's checks. A dispatch without it (an
# older builder) sends no targets, and OrganizeOS records the build at no
# address. After the admin confirmed replacing the organization's old site in
# the dialog, the replace_pages input is true; the run checks it and sends
# replacePages to OrganizeOS, which replaces the old site only when the
# targets include the address that serves it.
#
# The run ends by telling the builder how it went (internal/publish-status):
# PUBLISHED once the pointer is flipped, FAILED when any step fails or the run
# is cancelled before the flip (see the two report steps). That is what the
# builder's Publish dialog shows the admin; without it every publish reads
# "pending" until the UI gives up.
#
# No run script holds a ${{ }} substitution: inputs, variables, secrets and
# step outputs reach it through its step's env, JSON bodies are built from
# those with node, and a step output is written only after its value is
# checked. A dispatch input can then never break out of the shell or a body.
#
# Required repository secrets (all server-to-server; none reach the built app):
#   WSTD_SERVICE_TOKEN          TRPC_SERVER_API_TOKEN of the deployed builder
#                               (also authenticates the publish-status report)
#   VERCEL_TOKEN                scoped deploy token for the sites project
#   VERCEL_ORG_ID               Vercel team/org id
#   VERCEL_SITES_PROJECT_ID     project id of organizeos-sites
#   PUBLISH_CALLBACK_URL        OrganizeOS publish-callback endpoint
#   PUBLISH_CALLBACK_TOKEN      shared secret for that endpoint
# Required repository variable:
#   BUILDER_ORIGIN              e.g. https://builder.organizeos.org

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Published Build id to deploy"
        required: true
      organization_id:
        description: "OrganizeOS organization id (for the pointer flip)"
        required: true
      targets:
        description: "JSON array of the publish targets: builtin or a host"
        required: false
      replace_pages:
        description: "true when the admin confirmed replacing the old site"
        required: false
      embeds:
        description: "true when the builder that dispatched ships embeds"
        required: false

concurrency:
  # One publish at a time per org; a newer publish supersedes a queued one.
  group: publish-${{ inputs.organization_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    timeout-minutes: 25
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Read the targets
        # OrganizeOS fork: the addresses ticked in the Publish dialog
        # (docs/ORGANIZEOS-FORK.md section 5), untrusted text, checked before
        # anything installs, syncs or deploys. Absent or empty writes an empty
        # output (a builder that sends none). Otherwise it must be a JSON array
        # of 1 to 20 distinct strings, each builtin or a lower-case host with no
        # scheme, port or path, or the run fails here and nothing deploys. The
        # output is the array as JSON, written only after the check.
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          value=$(node -e '
            const raw = process.env.TARGETS ?? "";
            if (raw === "") {
              process.exit(0);
            }
            const host = /^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$/;
            let targets;
            try {
              targets = JSON.parse(raw);
            } catch {}
            const valid =
              Array.isArray(targets) &&
              targets.length >= 1 &&
              targets.length <= 20 &&
              new Set(targets).size === targets.length &&
              targets.every((key) => typeof key === "string" && (key === "builtin" || host.test(key)));
            if (valid === false) {
              console.log("::error::The targets input is not a JSON array of 1 to 20 distinct keys, each builtin or a host.");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(targets));
          ') || { printf '%s\n' "$value"; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Read the replace flag
        # OrganizeOS fork: the admin confirmed replacing the organization's old
        # site in the Publish dialog (docs/ORGANIZEOS-FORK.md section 5).
        # Untrusted text, checked before anything installs, syncs or deploys:
        # absent or empty writes an empty output; exactly true, with targets
        # given, writes true; anything else fails the run here and nothing
        # deploys. The output is written only after the check.
        id: replace-pages
        env:
          REPLACE_PAGES: ${{ inputs.replace_pages }}
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          value=$(node -e '
            const raw = process.env.REPLACE_PAGES ?? "";
            if (raw === "") {
              process.exit(0);
            }
            if (raw !== "true" || (process.env.TARGETS_INPUT ?? "") === "") {
              console.log("::error::The replace_pages input is not true with targets given.");
              process.exit(1);
            }
            process.stdout.write("true");
          ') || { printf '%s\n' "$value"; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Read the embeds flag
        # OrganizeOS fork: the builder that dispatched ships embeds
        # (orgEmbedsMayShip(), docs/ORGANIZEOS-FORK.md section 5). It sends the
        # input only when true, so a builder whose switch is off can still
        # dispatch to a workflow that does not declare it (after a revert).
        # Untrusted text, checked before anything installs: absent or empty
        # writes false; exactly true writes true; anything else fails the run
        # here, writing nothing. "Read the org script switch" compares it with
        # this run's CLI.
        id: embeds
        env:
          EMBEDS: ${{ inputs.embeds }}
        run: |
          value=$(node -e '
            const raw = process.env.EMBEDS ?? "";
            if (raw === "") {
              process.stdout.write("false");
              process.exit(0);
            }
            if (raw !== "true") {
              console.log("::error::The embeds input is not true.");
              process.exit(1);
            }
            process.stdout.write("true");
          ') || { printf '%s\n' "$value"; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Install and build CLI
        run: |
          pnpm install
          pnpm -r --filter "./packages/*" build

      - name: Install the Vercel CLI
        # A step of its own, so no secret is in its environment, at a pinned
        # version and without install scripts, which would run before anything
        # checks the package. Bump the pin on purpose, to a release at least two
        # weeks old, and check that the CLI still works without its scripts.
        run: |
          npm install --global --ignore-scripts vercel@63.1.2

      - name: Sync project bundle
        working-directory: ${{ runner.temp }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
        run: |
          node "$GITHUB_WORKSPACE/packages/cli/bin.js" sync \
            --buildId "$BUILD_ID" \
            --origin "$BUILDER_ORIGIN" \
            --authToken "$WSTD_SERVICE_TOKEN"

      - name: Build site
        # OrganizeOS fork: prebuild writes the publish facts, last, to the
        # fork's own checkout, outside runner.temp, where vercel deploy uploads
        # from (docs/ORGANIZEOS-FORK.md section 5). A file from an earlier run
        # is removed first, so only this build's facts are read.
        working-directory: ${{ runner.temp }}
        run: |
          rm -f "$GITHUB_WORKSPACE/organizeos-publish-facts.json"
          ORGANIZEOS_PUBLISH_FACTS_FILE="$GITHUB_WORKSPACE/organizeos-publish-facts.json" node "$GITHUB_WORKSPACE/packages/cli/bin.js" build \
            --template react-router --template react-router-vercel

      - name: Read the org script switch
        # OrganizeOS fork: what the run reports as orgScript is this build's
        # fact, read from the facts file prebuild wrote (docs/ORGANIZEOS-FORK.md
        # sections 5 and 10), never configuration. The step fails, before
        # anything deploys, unless this run's CLI has the address rule and
        # orgScriptMayRun() is false, the embeds input equals its
        # orgEmbedsMayShip(), and the facts are exactly { "orgScript": boolean },
        # true only while embeds may ship (they do: true is now a build that
        # carries an embed or custom code). Its output is that boolean, written
        # only after every check.
        id: org-script
        working-directory: packages/cli
        env:
          EMBEDS: ${{ steps.embeds.outputs.value }}
        run: |
          export ORGANIZEOS_PUBLISH_FACTS="$GITHUB_WORKSPACE/organizeos-publish-facts.json"
          value=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { orgEmbedsMayShip, orgScriptMayRun, urlMayRun } from "@organizeos/site-components/org-script";
            const fail = (message) => {
              console.log("::error::" + message);
              process.exit(1);
            };
            if (typeof urlMayRun !== "function" || urlMayRun("javascript:alert(1)", false) !== false) {
              throw new Error("this CLI does not check unsafe addresses");
            }
            const mayRun = orgScriptMayRun();
            if (mayRun !== false) {
              fail("orgScriptMayRun() is " + JSON.stringify(mayRun) + ". Org content other than the embeds orgEmbedsMayShip() governs stays data: this switch stays off.");
            }
            const embeds = orgEmbedsMayShip();
            if (typeof embeds !== "boolean" || String(embeds) !== process.env.EMBEDS) {
              fail("The embeds input (" + process.env.EMBEDS + ") differs from this CLI\u0027s orgEmbedsMayShip(). Nothing was deployed.");
            }
            let facts;
            try {
              facts = JSON.parse(readFileSync(process.env.ORGANIZEOS_PUBLISH_FACTS, "utf8"));
            } catch {}
            if (
              typeof facts !== "object" ||
              facts === null ||
              Array.isArray(facts) ||
              Object.keys(facts).length !== 1 ||
              typeof facts.orgScript !== "boolean"
            ) {
              fail("The publish facts are missing or malformed. Nothing was deployed.");
            }
            if (facts.orgScript === true && embeds === false) {
              fail("The build carries org code while embeds may not ship. Nothing was deployed.");
            }
            process.stdout.write(JSON.stringify(facts.orgScript));
          ') || { printf '%s\n' "$value"; exit 1; }
          if [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::The publish facts did not read as a boolean. Nothing was deployed."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Read the guard level
        # OrganizeOS fork: which of OrganizeOS's launch requirements this run's
        # CLI meets (ORGANIZEOS_GUARD_LEVEL, docs/ORGANIZEOS-FORK.md section 5),
        # read from the CLI it built, never configuration. It fails unless the
        # value is an integer from 0 to 32767, the range OrganizeOS takes.
        id: guard-level
        working-directory: packages/cli
        run: |
          value=$(node --input-type=module -e '
            import { ORGANIZEOS_GUARD_LEVEL } from "@organizeos/site-components/org-script";
            process.stdout.write(JSON.stringify(ORGANIZEOS_GUARD_LEVEL));
          ')
          if [[ ! "$value" =~ ^(0|[1-9][0-9]{0,4})$ ]] || [ "$value" -gt 32767 ]; then
            echo "::error::ORGANIZEOS_GUARD_LEVEL is ${value:-unreadable}. OrganizeOS takes an integer from 0 to 32767."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        # The deploy token is in this step's env only, never on a command line:
        # the Vercel CLI reads VERCEL_TOKEN from the environment.
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITES_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --yes --prod --skip-domain)
          if [[ ! "$url" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Vercel did not answer with a deployment URL."
            exit 1
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Flip the OrganizeOS pointer
        # curl fails only on 4xx and 5xx. A redirect (an http:// or slightly
        # different PUBLISH_CALLBACK_URL answers 308) would pass while flipping
        # nothing, and the run would still report the build PUBLISHED. Anything
        # but a 2xx fails the run.
        # OrganizeOS fork: orgScript is this build's fact and guardLevel what
        # this run's CLI said ("Read the org script switch", "Read the guard
        # level"), each from that step's output alone and checked again here
        # before anything is sent: orgScript a JSON boolean, sent as it is,
        # guardLevel an integer from 0 to 32767 (docs/ORGANIZEOS-FORK.md
        # sections 5 and 10). Facts and deployment URL come from one run. targets is what
        # "Read the targets" wrote, checked again by the same rule, and sent only
        # when there are any. replacePages is sent, as true, only when "Read the
        # replace flag" wrote true and targets are sent. On success the log
        # shows the answer's live and launchable only, each only when it is a
        # boolean, live_targets, the count of the answer's targets that are
        # live, never a host, and replaced_pages=true when the flag was sent;
        # on failure
        # it shows the answer. The report steps read this step's outcome, under
        # its id.
        id: flip
        env:
          CALLBACK_URL: ${{ secrets.PUBLISH_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.PUBLISH_CALLBACK_TOKEN }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          BUILD_ID: ${{ inputs.build_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          ORG_SCRIPT: ${{ steps.org-script.outputs.value }}
          GUARD_LEVEL: ${{ steps.guard-level.outputs.value }}
          TARGETS: ${{ steps.targets.outputs.value }}
          REPLACE_PAGES: ${{ steps.replace-pages.outputs.value }}
        run: |
          body=$(node -e '
            const env = process.env;
            let orgScript;
            try {
              orgScript = JSON.parse(env.ORG_SCRIPT ?? "");
            } catch {}
            if (typeof orgScript !== "boolean") {
              console.log("::error::The org script report is not a boolean, so nothing was sent.");
              process.exit(1);
            }
            const level = env.GUARD_LEVEL ?? "";
            if (/^(0|[1-9][0-9]{0,4})$/.test(level) === false || Number(level) > 32767) {
              console.log("::error::The guard level is not an integer from 0 to 32767, so nothing was sent.");
              process.exit(1);
            }
            let targets;
            if ((env.TARGETS ?? "") !== "") {
              const host = /^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$/;
              try {
                targets = JSON.parse(env.TARGETS);
              } catch {}
              const valid =
                Array.isArray(targets) &&
                targets.length >= 1 &&
                targets.length <= 20 &&
                new Set(targets).size === targets.length &&
                targets.every((key) => typeof key === "string" && (key === "builtin" || host.test(key)));
              if (valid === false) {
                console.log("::error::The targets did not pass the check, so nothing was sent.");
                process.exit(1);
              }
            }
            let replacePages = false;
            if ((env.REPLACE_PAGES ?? "") !== "") {
              if (env.REPLACE_PAGES !== "true" || targets === undefined) {
                console.log("::error::The replace flag did not pass the check, so nothing was sent.");
                process.exit(1);
              }
              replacePages = true;
            }
            process.stdout.write(JSON.stringify({
              organizationId: env.ORGANIZATION_ID ?? "",
              buildId: env.BUILD_ID ?? "",
              deploymentUrl: env.DEPLOYMENT_URL ?? "",
              orgScript,
              guardLevel: Number(level),
              ...(targets === undefined ? {} : { targets }),
              ...(replacePages ? { replacePages: true } : {}),
            }));
          ') || { printf '%s\n' "$body"; exit 1; }
          response="$RUNNER_TEMP/callback-response.txt"
          status=$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -o "$response" -w '%{http_code}' -X POST \
            "$CALLBACK_URL" \
            -H "Authorization: $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body") || { cat "$response"; echo; exit 1; }
          case "$status" in
            2??)
              echo "Pointer flipped ($status)"
              RESPONSE="$response" node -e '
                let answer;
                try {
                  answer = JSON.parse(require("node:fs").readFileSync(process.env.RESPONSE, "utf8"));
                } catch {
                  process.exit(0);
                }
                for (const key of ["live", "launchable"]) {
                  const value = typeof answer === "object" && answer !== null ? answer[key] : undefined;
                  if (typeof value === "boolean") {
                    console.log(key + "=" + value);
                  }
                }
                const targets = typeof answer === "object" && answer !== null ? answer.targets : undefined;
                if (Array.isArray(targets)) {
                  const live = targets.filter((target) => typeof target === "object" && target !== null && target.live === true);
                  console.log("live_targets=" + live.length);
                }
                if (process.env.REPLACE_PAGES === "true") {
                  console.log("replaced_pages=true");
                }
              ' || true
              ;;
            *)
              cat "$response"
              echo
              echo "::error::The publish callback answered $status, so the pointer was not flipped. PUBLISH_CALLBACK_URL must be the exact https URL, with no redirect."
              exit 1
              ;;
          esac

      - name: Report the build as published
        # The site is live once the pointer is flipped; a failed status report
        # must not fail the run (and so must not mark the build FAILED below).
        # A run cancelled after the flip (by a newer publish for the org, or
        # the job's timeout) reports it too: the pointer did move.
        if: success() || (cancelled() && steps.flip.outcome == 'success')
        continue-on-error: true
        env:
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          body=$(node -e 'process.stdout.write(JSON.stringify({ buildId: process.env.BUILD_ID ?? "", status: "PUBLISHED" }))')
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            "$BUILDER_ORIGIN/internal/publish-status" \
            -H "Authorization: $WSTD_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body"

      - name: Report the build as failed
        # A failure, or a run cancelled by a newer publish for the org or by
        # the job's timeout, marks the build FAILED, so it does not read
        # pending. Never once the flip succeeded: that build is published
        # (reported above), and the builder would take FAILED over PUBLISHED.
        # Nor when the flip itself was cut off: whether the pointer moved is
        # unknown, so the build reads pending until the dialog gives up.
        if: (failure() || cancelled()) && steps.flip.outcome != 'success' && steps.flip.outcome != 'cancelled'
        env:
          BUILDER_ORIGIN: ${{ vars.BUILDER_ORIGIN }}
          WSTD_SERVICE_TOKEN: ${{ secrets.WSTD_SERVICE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          body=$(node -e 'process.stdout.write(JSON.stringify({ buildId: process.env.BUILD_ID ?? "", status: "FAILED" }))')
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            "$BUILDER_ORIGIN/internal/publish-status" \
            -H "Authorization: $WSTD_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$body"
