name: "Lint PR"

# OrganizeOS fork: the title check runs on pull_request with a read-only
# token, and the failed check carries the action's own message. Upstream also
# ran it on pull_request_target with pull-requests: write, to post and delete
# a comment; the fork runs no pull_request_target job and no step that writes.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  # The action reads the pull request through the API for its current title.
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          # Configure which types are allowed (newline-delimited).
          # Default: https://github.com/commitizen/conventional-commit-types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            experimental
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
